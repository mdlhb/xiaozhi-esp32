name: Build Boards
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build'
        required: true
        default: 'esp32-c6-touch-amoled-2.16'
        type: string

permissions:
  contents: read

jobs:
  build-single:
    name: Build ${{ inputs.board || 'all' }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          BOARD="${{ inputs.board }}"
          if [ -z "$BOARD" ]; then
            BOARD="esp32-c6-touch-amoled-2.16"
          fi
          python scripts/release.py $BOARD || true
          find build -name "*.bin" -ls 2>/dev/null || true

      - name: Find firmware binary
        id: find_bin
        shell: bash
        run: |
          BIN=$(find build -name "merged-binary.bin" -o -name "*.bin" | head -3)
          echo "Found: $BIN"
          echo "bin_path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-${{ inputs.board || 'esp32-c6-touch-amoled-2.16' }}
          path: build/merged-binary.bin
          if-no-files-found: warn
