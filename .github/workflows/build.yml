name: Build Boards
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py waveshare/esp32-c6-touch-amoled-2.16 --name c6-amoled-2.16

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware
          path: build/*.bin
          if-no-files-found: error
